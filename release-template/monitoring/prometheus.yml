global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: foundry
    metrics_path: /ops/metrics
    authorization:
      credentials_file: /etc/foundry/ops-token
    static_configs:
      - targets: ['api:8000']
