name: ${RELEASE_NAME:?Run python3 configure-release.py first}
x-limits: &limits
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 2g
  cpus: 2
  init: true
  tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']
  networks: [private]
  pull_policy: never
  logging:
    driver: json-file
    options: {max-size: 5m, max-file: '2'}
services:
  web:
    <<: *limits
    image: ${RELEASE_NAME}-web:${RELEASE_TAG:-release}
    build: ./frontend
    user: '1000:1000'
    ports: ['127.0.0.1:${APP_PORT:-8080}:8080']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
  api:
    <<: *limits
    image: ${RELEASE_NAME}-api:${RELEASE_TAG:-release}
    build: ./backend
    user: '1000:1000'
    environment:
      DATABASE_URL: postgresql+psycopg://app:${DATABASE_PASSWORD:?Set a generated password}@db:5432/app
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: /app
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  migrate:
    <<: *limits
    image: ${RELEASE_NAME}-api:${RELEASE_TAG:-release}
    user: '1000:1000'
    command: [python, /opt/foundry/runtime.py, migrate]
    environment:
      DATABASE_URL: postgresql+psycopg://app:${DATABASE_PASSWORD:?Set a generated password}@db:5432/app
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: /app
    depends_on:
      db: {condition: service_healthy}
  db:
    <<: *limits
    image: postgres:17-bookworm
    user: '999:999'
    environment:
      POSTGRES_USER: app
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set a generated password}
    volumes: [database:/var/lib/postgresql/data]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=128m', '/var/run/postgresql:rw,nosuid,uid=999,gid=999,size=16m']
    restart: unless-stopped
    healthcheck:
      test: [CMD, pg_isready, -U, app, -d, app]
      interval: 3s
      timeout: 3s
      retries: 20
networks:
  private: {internal: true}
volumes:
  database: {}
