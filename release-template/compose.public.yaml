# Opt in explicitly: compose -f compose.yaml -f compose.public.yaml ...
services:
  caddy:
    image: caddy:2.11.4-alpine
    pull_policy: never
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: '0'}
    pids_limit: 100
    mem_limit: 256m
    cpus: 1
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    logging: {driver: json-file, options: {max-size: 5m, max-file: '3'}}
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Run configure-deployment.py}
      ACME_EMAIL: ${ACME_EMAIL:?Run configure-deployment.py}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [private, edge]
    depends_on:
      web: {condition: service_healthy}
networks:
  edge: {}
volumes:
  caddy_data: {}
  caddy_config: {}
