<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>__APP_NAME__</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7f5;
        color: #1d2a20;
      }
      main { max-width: 22rem; text-align: center; }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 20px;
        display: grid; place-items: center;
        border-radius: 16px; background: #dce7d7; color: #23402a;
        font-size: 26px; font-weight: 700;
      }
      h1 { font-size: 1.4rem; line-height: 1.3; margin: 0 0 10px; font-weight: 600; }
      p { margin: 0 0 24px; color: #4a5a4e; }
      button {
        font: inherit; font-weight: 600;
        padding: 13px 26px; min-height: 48px; width: 100%;
        border: 0; border-radius: 10px; cursor: pointer;
        background: #23402a; color: #fff;
      }
      button:disabled { opacity: .6; cursor: progress; }
      .status { margin-top: 16px; min-height: 1.4em; font-size: .85rem; color: #4a5a4e; }
      @media (prefers-color-scheme: dark) {
        body { background: #10150f; color: #e6ede4; }
        .mark { background: #1d2a1c; color: #cfe0c6; }
        p, .status { color: #9fb09f; }
        button { background: #cfe0c6; color: #16210f; }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Shown only when the app cannot reach __ORIGIN__. A store reviewer with a
           flaky connection sees this instead of a blank white screen, which is one
           of the commoner reasons a remote-content app is rejected. -->
      <div class="mark" aria-hidden="true">__APP_INITIAL__</div>
      <h1>__APP_NAME__ needs a connection</h1>
      <p>Your data is stored securely on the server, so this app needs to be online to show it.</p>
      <button id="retry" type="button">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      var origin = '__ORIGIN__';
      var retry = document.getElementById('retry');
      var status = document.getElementById('status');
      function attempt() {
        retry.disabled = true;
        status.textContent = 'Checking the connection…';
        // Cache-busted so a cached failure does not look like a live one.
        fetch(origin + '/healthz?probe=' + Date.now(), { cache: 'no-store', mode: 'no-cors' })
          .then(function () { location.replace(origin); })
          .catch(function () {
            retry.disabled = false;
            status.textContent = 'Still offline. Check your signal and try again.';
          });
      }
      retry.addEventListener('click', attempt);
      window.addEventListener('online', attempt);
    </script>
  </body>
</html>
