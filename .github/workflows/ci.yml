name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: foundry_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt ruff
      - run: npm --prefix frontend ci
      - run: npm test && npm run build && npm --prefix frontend run smoke
      - run: ruff check backend scripts tests
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: backend
          FOUNDRY_TEST_DATABASE_URL: postgresql://foundry_test:test-only-password@127.0.0.1:5432/foundry_test
      - run: python scripts/package-source.py --output release/local-foundry-source.zip
